<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mijn speelkast</title>
</head>
<body>
    <main>
        <h1>Spellenkast van {{username}}</h1>
        <p>Je bent ingelogd als: {{username}}</p>
        <form action="indexFile.php?page=logout" method="post">
            <button type="submit">Uitloggen</button>
        </form>
        <hr>
        <!-- Gedeelde navigatie naar de kastsubpagina's -->
        <nav>
            <a href="indexFile.php?page=select-games" aria-current="{{select_games_current}}" style="display: inline-block; background-color: #b8ccf5; border: 1px solid black; border-radius: 3px; padding: 4px;">Selecteer spellen</a>
            <a href="indexFile.php?page=my-selection" aria-current="{{my_selection_current}}" style="display: inline-block; background-color: #b8ccf5; border: 1px solid black; border-radius: 3px; padding: 4px;">Mijn selectie</a>
            <a href="indexFile.php?page=add-game" aria-current="{{add_game_current}}" style="display: inline-block; background-color: #b8ccf5; border: 1px solid black; border-radius: 3px; padding: 4px;">Spel toevoegen</a>
        </nav>
        <!-- PageController plaatst hier de gekozen subpagina -->
        <section>
            {{content}}
        </section>
    </main>
</body>
</html>
