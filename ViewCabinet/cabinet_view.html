<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mijn speelkast</title>
    <style>
        /* Het houten kader sluit aan op de deur van de loginpagina. */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px 16px;
            background: radial-gradient(circle at top, #faf7f1, #ded6c9);
            color: #30251d;
            font: 16px/1.5 Arial, sans-serif;
        }

        .cabinet {
            width: min(100%, 1200px);
            margin: 0 auto;
            padding: 24px;
            border: 12px solid #39291f;
            border-radius: 6px;
            background: linear-gradient(
                90deg, #68442e, #80583c 50%, #68442e
            );
            box-shadow:
                inset 0 0 0 8px #593c2a,
                0 18px 45px #39291f40;
        }

        /* Het naamplaatje en de accountgegevens staan boven de kastinhoud. */
        .cabinet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            color: #fff7ec;
            overflow-wrap: anywhere;
        }

        .cabinet-header h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.2;
        }

        .cabinet-header p { margin: 8px 0 0; }

        .cabinet-header .brand {
            display: inline-block;
            margin: 0 0 14px;
            padding: 6px 10px;
            border: 1px solid #c6a66d;
            border-radius: 2px;
            background: #ead5ae;
            color: #39291f;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* De navigatie staat op een houten plank. */
        .cabinet-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 24px;
            padding-bottom: 14px;
            border-bottom: 8px solid #4b3324;
        }

        .cabinet-nav a {
            padding: 10px 14px;
            border: 1px solid #c6a66d;
            border-radius: 4px;
            background: #ead5ae;
            color: #39291f;
            font-weight: bold;
            text-decoration: none;
        }

        .cabinet-nav a:hover,
        .cabinet-nav a[aria-current="page"] {
            background: #fff6e5;
            box-shadow: inset 0 -3px 0 #a77c38;
        }

        /* Een lichte achterwand maakt de inhoud van de kast leesbaar. */
        .cabinet-content {
            min-width: 0;
            margin-top: 20px;
            padding: 24px;
            border: 1px solid #a98561;
            border-bottom: 12px solid #5b3e2c;
            border-radius: 4px;
            background: linear-gradient(
                90deg, #efe1cb, #f9f0df 50%, #efe1cb
            );
            box-shadow: inset 0 2px 6px #39291f20;
        }

        .cabinet-content h2 {
            margin: 0 0 16px;
            font-size: 24px;
        }

        .cabinet-content h3 { margin: 0 0 8px; }

        .cabinet-content hr {
            margin: 24px 0;
            border: 0;
            border-top: 1px solid #cdb592;
        }

        /* Op kleine schermen blijft de bestaande groepering naast elkaar staan. */
        .cabinet-overview {
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 8px;
        }

        .cabinet-items {
            width: 100%;
            min-width: 760px;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 12px 18px;
            text-align: left;
        }

        .cabinet-items > tbody > tr > td {
            vertical-align: top;
            overflow-wrap: anywhere;
        }

        /*
        Overschrijft bestaande inline kleuren alleen bij gevulde spelvakken.
        Een leeg uitbreidingsvak krijgt daardoor geen achtergrond of kader.
        */
        .cabinet-items > tbody > tr > td:has(> table) {
            padding: 12px;
            border: 1px solid #ceb58e !important;
            border-radius: 4px;
            background: #fffbf3 !important;
            box-shadow:
                0 6px 0 #79543b,
                0 10px 12px #39291f20;
        }

        .cabinet-items table {
            width: 100%;
            border-collapse: collapse;
        }

        .cabinet-items table td {
            padding: 4px;
            vertical-align: top;
        }

        .cabinet-items img {
            max-width: 100%;
            height: auto;
            border-radius: 3px;
        }

        .cabinet-items ul {
            margin: 8px 0 0;
            padding-left: 18px;
        }

        /* Gedeelde vormgeving voor de bestaande formulieren. */
        input:not([type="checkbox"]):not([type="hidden"]),
        select {
            max-width: 100%;
            padding: 10px 12px;
            border: 1px solid #cdb592;
            border-radius: 4px;
            background: #fffaf3;
            color: #30251d;
            font: inherit;
        }

        input[type="checkbox"] { accent-color: #79543b; }

        button {
            max-width: 100%;
            margin: 4px 0;
            padding: 10px 16px;
            border: 1px solid #c6a66d;
            border-radius: 4px;
            background: #e8ca90;
            color: #30251d;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #f4dcae; }

        input:focus-visible,
        select:focus-visible,
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #a77c38;
            outline-offset: 3px;
        }

        .cabinet-header button:focus-visible,
        .cabinet-nav a:focus-visible {
            outline-color: #ffe0a1;
        }

        /* Geeft het formulier voor nieuwe spellen een vaste, rustige indeling. */
        #game-form {
            display: grid;
            gap: 10px;
            max-width: 680px;
        }

        #game-form br { display: none; }

        #game-form input:not([type="checkbox"]),
        #game-form select {
            width: 100%;
        }

        #game-form label,
        #game-form legend {
            font-weight: bold;
        }

        #game-form fieldset {
            min-width: 0;
            margin: 6px 0;
            padding: 16px;
            border: 1px solid #cdb592;
            border-radius: 4px;
        }

        #game-form fieldset label {
            display: block;
            margin: 8px 0 4px;
        }

        #game-form legend { padding: 0 6px; }

        .cabinet-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Geeft bestaande meldingen een herkenbaar vlak. */
        .cabinet-content [role="status"] {
            padding: 12px;
            border-left: 4px solid #a77c38;
            background: #fff8e8;
            overflow-wrap: anywhere;
        }

        .cabinet-content [role="status"]:empty { display: none; }

        /* Houdt voldoende ruimte over op een klein scherm. */
        @media (max-width: 600px) {
            body { padding: 12px; }
            .cabinet { padding: 14px; border-width: 8px; }
            .cabinet-content { padding: 14px; }
            .cabinet-header h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <main class="cabinet">

        <header class="cabinet-header">
            <div>
                <p class="brand">De Speelkast</p>
                <h1>Spellenkast van {{username}}</h1>
                <p>Je bent ingelogd als: {{username}}</p>
            </div>
            <form action="indexFile.php?page=logout" method="post">
                <button type="submit">Uitloggen</button>
            </form>
        </header>
        <nav class="cabinet-nav" aria-label="Kastpagina's">
            <a href="indexFile.php?page=select-games"aria-current="{{select_games_current}}">Selecteer spellen</a>
            <a href="indexFile.php?page=my-selection"aria-current="{{my_selection_current}}">Mijn selectie</a>
            <a href="indexFile.php?page=add-game"aria-current="{{add_game_current}}">Spel toevoegen</a>
            <a href="indexFile.php?page=avondlijst"aria-current="{{evening_list_current}}">Avondlijst</a>
        </nav>
        <section class="cabinet-content">
            {{content}}
        </section>
    </main>
</body>
</html>
