<h2>Mijn selectie</h2>
<div class="cabinet-overview">
    <table class="cabinet-items">
        <colgroup>
            <col style="width: 50%;">
            <col style="width: 50%;">
        </colgroup>
        <tbody>
            {{items}}
        </tbody>
    </table>
</div>
<hr>
<h2>Exporteer selectie naar XML</h2>
<p>Geselecteerde spellen:</p>
<ul>
    {{selected_titles}}
</ul>

<form class="cabinet-actions" action="indexFile.php?page=my-selection" method="post">
    <input type="hidden" name="action" value="export_xml">
    <button type="submit" name="export_choice" value="selection">
        Exporteer mijn selectie
    </button>
    <button type="submit" name="export_choice" value="all">
        Exporteer volledige kast
    </button>
</form>
