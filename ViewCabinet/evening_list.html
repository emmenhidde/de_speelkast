<h2>De Avondlijst</h2>
<h3>Laad een XML in:</h3>

<!-- De XML wordt alleen voor deze weergave ingelezen -->
<form action="indexFile.php?page=avondlijst"
      method="post"
      enctype="multipart/form-data">

    <input type="hidden" name="action" value="load_evening_xml">

    <input type="file"
           name="evening_xml"
           accept=".xml,application/xml,text/xml"
           aria-label="XML-bestand"
           required>

    <button type="submit">Laad de XML</button>
</form>

<p role="status">{{evening_message}}</p>

<div class="evening-result">
    {{Evening_list}}
</div>

<style>
    .evening-result {
        overflow-x: auto;
        padding-bottom: 18px;
    }

    .evening-grid,
    .evening-wide {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
    }

    .evening-grid {
        min-width: 760px;
        margin-top: 20px;
    }

    .evening-pair {
        grid-column: span 2;
        min-width: 0;
    }

    .evening-wide {
        grid-column: 1 / -1;
    }

    .evening-group {
        min-width: 0;
        border: 1px solid #ceb58e;
        border-radius: 4px;
        background: #fffbf3;
        box-shadow:
            0 6px 0 #79543b,
            0 10px 12px #39291f20;
    }

    .evening-group > p {
        margin: 0;
        padding: 12px;
        background: #ead5ae;
    }

    .evening-cards { display: grid; }

    .evening-card {
        min-width: 0;
        padding: 12px;
        overflow-wrap: anywhere;
    }

    .evening-photo {
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .evening-photo img {
        width: 100%;
        max-width: 130px;
        height: 150px;
        object-fit: contain;
    }

    .evening-card h3,
    .evening-card p {
        margin: 8px 0;
    }
</style>
